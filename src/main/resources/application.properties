# ════════════════════════════════════════
# Bharat Sarthi Driver - Application Config
# ════════════════════════════════════════

spring.application.name=bharat-sarthi-driver

# ────────────────────────────────────────
# Server Configuration
# ────────────────────────────────────────
server.port=${PORT:8080}
server.address=0.0.0.0

# ────────────────────────────────────────
# MySQL Database Configuration
# ────────────────────────────────────────
# Purani line (remove karo)
#spring.datasource.url=${MYSQL_PUBLIC_URL}

# Nayi line (ye lagao)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ────────────────────────────────────────
# Hibernate / JPA
# ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ────────────────────────────────────────
# HikariCP Connection Pool
# ────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000

# ────────────────────────────────────────
# File Upload Configuration
# ────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB
spring.servlet.multipart.file-size-threshold=1KB

# ────────────────────────────────────────
# Jackson Configuration
# ────────────────────────────────────────
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# ────────────────────────────────────────
# Logging
# ────────────────────────────────────────
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.bharatsarthi=DEBUG

# ────────────────────────────────────────
# Banner
# ────────────────────────────────────────
spring.main.banner-mode=off